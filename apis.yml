name: Latitude Communications
description: 'Latitude Communications, Inc. was a Santa Clara, California enterprise conferencing
  company, incorporated in April 1993 and venture-backed by Mayfield Fund, Menlo Ventures, Asset
  Management Associates, and Canaan Ventures (Canaan Partners). It developed, sold, and hosted
  MeetingPlace, an integrated voice and web conferencing system for geographically dispersed
  enterprises, first shipped commercially in December 1994 and sold to more than 430 enterprise
  customers by the end of 2002, including Aetna, Cisco, Credit Suisse First Boston, Fidelity
  Investments, Lockheed Martin, Oracle, and the U.S. Federal Reserve Bank. The company IPO''d on
  the Nasdaq National Market under the symbol LATD at $12.00 per share in May 1999 and reported
  revenue of $43.4 million in 2000, $33.9 million in 2001, and $40.5 million in 2002. Cisco
  Systems acquired Latitude in a cash merger at $3.95 per share, completed in late 2003; Latitude
  filed a Form 15 terminating its SEC registration on 2004-01-13, and MeetingPlace was absorbed
  into Cisco''s conferencing line as Cisco Unified MeetingPlace. The company no longer operates as
  an independent entity and never published a public API, developer portal, SDK, or
  machine-readable interface — its 10-K describes only internally developed APIs used to integrate
  MeetingPlace with web, e-mail, and fax servers. This profile is retained as a historical record
  of the Canaan Partners portfolio and is not an active API provider. NOTE: unrelated to the
  present-day latitude.sh bare-metal cloud provider and to the parked latitude.com page (see
  x-disambiguation).'
